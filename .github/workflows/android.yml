name: App Android

# Compila la app de Android (Capacitor) cuando cambia algo en mobile/ y la deja en
# https://lovebug20.vercel.app/lovebug-android.apk (y en Releases del repo).
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Los runners de GitHub ya traen el SDK de Android: solo nos aseguramos de tener la versión 36.
      - name: SDK de Android
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0"

      # Avisos: con el google-services.json de Firebase (en mobile/android/app/ o como secreto
      # GOOGLE_SERVICES_JSON) la app trae las notificaciones y se lo avisa a la web en el user agent.
      - name: Firebase (avisos)
        working-directory: mobile
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          F=android/app/google-services.json
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > "$F"; fi
          if [ ! -s "$F" ]; then
            echo "Sin google-services.json: la app sale sin avisos."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const json = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const ok = (json.client || []).some((c) => c.client_info?.android_client_info?.package_name === "app.lovebug.familia");
            if (!ok) { console.log("::warning::El google-services.json no es de app.lovebug.familia: la app sale sin avisos."); fs.rmSync(process.argv[1]); process.exit(0); }
            const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.appendUserAgent = "LovebugApp LovebugPush";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
            console.log("Con avisos (Firebase: " + json.project_info?.project_id + ")");
          ' "$F"

      - name: Dependencias y sync de Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Compilar el APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Lovebug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Lovebug-android-${{ github.run_number }}
          path: Lovebug.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Lovebug para Android · versión ${{ github.run_number }}
          make_latest: true
          files: Lovebug.apk
          body: |
            App de Lovebug para Android: abre la web, pide la huella con el cartel del propio celu y recibe los avisos.
            Instalación: descargá Lovebug.apk en el celu, abrilo y permití instalar apps desde el navegador si Android lo pide.
            Las versiones nuevas se instalan encima de la anterior.

      - name: Dejarla para descargar desde la web
        run: |
          cp Lovebug.apk public/lovebug-android.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lovebug-android.apk
          git commit -m "App Android: versión ${{ github.run_number }}" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
